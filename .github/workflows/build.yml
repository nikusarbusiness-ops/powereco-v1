name: Build PowerEco

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Ordnerstruktur herstellen (falls Dateien flach hochgeladen wurden)
        run: |
          if [ ! -f src/main/java/de/coreeco/CoreEco.java ]; then
            mkdir -p src/main/java/de/coreeco src/main/resources
            mv ./*.java src/main/java/de/coreeco/ 2>/dev/null || true
            mv plugin.yml config.yml src/main/resources/ 2>/dev/null || true
          fi
          test -f pom.xml || { echo "::error::pom.xml fehlt im Repo-Root"; exit 1; }
          test -f src/main/java/de/coreeco/CoreEco.java || { echo "::error::CoreEco.java fehlt im Repo"; exit 1; }
          test -f src/main/resources/plugin.yml || { echo "::error::plugin.yml fehlt im Repo"; exit 1; }
          find src -type f | sort

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Plugin bauen
        run: mvn -B clean package

      - name: JAR prüfen (plugin.yml und Hauptklasse müssen drin sein)
        run: |
          unzip -l target/PowerEco.jar
          unzip -l target/PowerEco.jar | grep -q "plugin.yml"
          unzip -l target/PowerEco.jar | grep -q "de/coreeco/CoreEco.class"

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerEco
          path: target/PowerEco.jar
          if-no-files-found: error

      - name: Release erstellen (nur bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/PowerEco.jar
